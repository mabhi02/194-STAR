<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Learning Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --success: #06d6a0;
            --info: #4cc9f0;
            --warning: #f9c74f;
            --danger: #ef476f;
            --light: #f8f9fa;
            --dark: #212529;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fb;
            min-height: 100vh;
        }
        
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }
        
        .quiz-area {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .db-schema {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .schema-table {
            margin-bottom: 15px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .schema-table-header {
            background-color: #f1f3f5;
            padding: 10px 15px;
            font-weight: bold;
            border-bottom: 1px solid #dee2e6;
            cursor: pointer;
        }
        
        .schema-table-content {
            padding: 15px;
            display: none;
            background-color: #fafafa;
        }
        
        .schema-table-content.active {
            display: block;
        }
        
        .results-area {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
            min-height: 300px;
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #dee2e6;
        }
        
        .question-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin: 0;
        }
        
        .question-counter {
            background-color: var(--primary);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
        }
        
        .btn-primary:hover {
            background-color: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        
        .btn-success {
            background-color: var(--success);
            border-color: var(--success);
        }
        
        .badge-success {
            background-color: var(--success);
        }
        
        .badge-warning {
            background-color: var(--warning);
        }
        
        .badge-danger {
            background-color: var(--danger);
        }
        
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        
        .table {
            font-size: 0.9rem;
        }
        
        .progress {
            height: 10px;
            margin-bottom: 20px;
        }
        
        .drag-option {
            padding: 10px 15px;
            margin: 5px 0;
            border: 1px solid #ced4da;
            border-radius: 5px;
            background-color: #f8f9fa;
            cursor: move;
        }
        
        .drop-area {
            min-height: 50px;
            padding: 10px;
            border: 2px dashed #ced4da;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        
        .drop-area.active {
            border-color: var(--primary);
            background-color: rgba(67, 97, 238, 0.1);
        }
        
        .option-container {
            margin-bottom: 20px;
        }
        
        .option-badge {
            display: inline-block;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 25px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            background-color: #f1f3f5;
            border: 1px solid #dee2e6;
        }
        
        .option-badge:hover {
            background-color: #e9ecef;
            transform: translateY(-2px);
        }
        
        .option-badge.selected {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        .chart-container {
            height: 300px;
            margin-top: 20px;
        }
        
        .correct-answer {
            background-color: rgba(6, 214, 160, 0.2);
            border: 1px solid var(--success);
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
        
        .sql-snippet {
            font-family: monospace;
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 3px solid var(--primary);
        }
        
        .multiple-choice {
            margin-top: 20px;
        }
        
        .choice-option {
            display: block;
            padding: 10px 15px;
            margin: 10px 0;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .choice-option:hover {
            background-color: #f8f9fa;
        }
        
        .choice-option.selected {
            background-color: rgba(67, 97, 238, 0.1);
            border-color: var(--primary);
        }
        
        .choice-option.correct {
            background-color: rgba(6, 214, 160, 0.2);
            border-color: var(--success);
        }
        
        .choice-option.incorrect {
            background-color: rgba(239, 71, 111, 0.2);
            border-color: var(--danger);
        }
        
        .feedback {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
        }
        
        .feedback.correct {
            background-color: rgba(6, 214, 160, 0.2);
            border: 1px solid var(--success);
        }
        
        .feedback.incorrect {
            background-color: rgba(239, 71, 111, 0.2);
            border: 1px solid var(--danger);
        }
        
        .level-badge {
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 10px;
            margin-left: 10px;
            vertical-align: middle;
        }
        
        .level-easy {
            background-color: #d1fae5;
            color: #065f46;
        }
        
        .level-medium {
            background-color: #ffedd5;
            color: #9a3412;
        }
        
        .level-hard {
            background-color: #fee2e2;
            color: #b91c1c;
        }
        
        .db-visualization {
            margin-top: 20px;
            text-align: center;
        }
        
        .table-relation-diagram {
            max-width: 100%;
            margin: 0 auto;
            padding: 20px;
        }
        
        .query-builder {
            margin: 20px 0;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
            border: 1px solid #dee2e6;
        }
        
        .query-segment {
            display: inline-block;
            background-color: #e9ecef;
            padding: 5px 10px;
            border-radius: 4px;
            margin: 0 5px 5px 0;
        }
        
        .segment-dropdown {
            display: inline-block;
            margin: 0 5px 5px 0;
        }
        
        .query-result {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #dee2e6;
            background-color: white;
        }
        
        /* Toast notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
        }
        
        .toast {
            min-width: 250px;
        }

        /* Added for better drag and drop experience */
        .dropped {
            margin-bottom: 5px;
            position: relative;
            padding-right: 40px;
        }

        .dropped button {
            position: absolute;
            right: 5px;
            top: 5px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-database me-2"></i>SQL Learning Quiz
            </a>
            <div class="d-flex">
                <button id="reset-quiz" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-redo me-1"></i>Reset Quiz
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <div class="progress">
                    <div id="progress-bar" class="progress-bar bg-primary" role="progressbar" style="width: 0%"></div>
                </div>
                
                <div class="quiz-area">
                    <div class="question-header">
                        <h4 class="question-title">Loading questions...</h4>
                        <span class="question-counter">0/0</span>
                    </div>
                    
                    <div id="question-content">
                        <!-- Question content will be loaded here -->
                    </div>
                    
                    <div class="d-flex justify-content-between mt-4">
                        <button id="prev-btn" class="btn btn-secondary" disabled>
                            <i class="fas fa-arrow-left me-1"></i>Previous
                        </button>
                        <button id="check-answer-btn" class="btn btn-primary">
                            Check Answer<i class="fas fa-check ms-1"></i>
                        </button>
                        <button id="next-btn" class="btn btn-primary" disabled>
                            Next<i class="fas fa-arrow-right ms-1"></i>
                        </button>
                    </div>
                </div>
                
                <div class="results-area">
                    <h4 class="mb-3">
                        <i class="fas fa-chart-bar me-2"></i>Results
                    </h4>
                    <div id="results-content">
                        <div class="alert alert-info">
                            Results will appear here after you run a query.
                        </div>
                    </div>
                    
                    <div id="chart-container" class="chart-container">
                        <!-- Chart will be displayed here -->
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="db-schema">
                    <h4 class="mb-3">
                        <i class="fas fa-table me-2"></i>Database Schema
                    </h4>
                    
                    <div id="schema-tables">
                        <!-- Schema tables will be loaded here -->
                    </div>
                    
                    <div class="db-visualization">
                        <h5 class="mb-3">Table Relationships</h5>
                        <div class="table-relation-diagram">
                            <!-- Table relationship diagram will be inserted here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast container for notifications -->
    <div class="toast-container"></div>

    <!-- Essential Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize SQL.js
            initSqlJs({
                locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
            }).then(SQL => {
                // Create a database
                const db = new SQL.Database();
                
                // Initialize the application
                const app = new SQLQuizApp(db);
                app.initialize();
            }).catch(err => {
                showToast('Error initializing SQL database: ' + err.message, 'danger');
            });
            
            // Create and manage the quiz app
            class SQLQuizApp {
                constructor(db) {
                    this.db = db;
                    this.questions = [];
                    this.questionOrder = []; // To store randomized question order
                    this.currentQuestionIndex = 0;
                    this.userAnswers = [];
                    this.score = 0;
                    this.answeredQuestions = new Set(); // Track which questions have been answered
                    
                    // DOM elements
                    this.questionTitle = document.querySelector('.question-title');
                    this.questionCounter = document.querySelector('.question-counter');
                    this.questionContent = document.getElementById('question-content');
                    this.resultsContent = document.getElementById('results-content');
                    this.chartContainer = document.getElementById('chart-container');
                    this.schemaTablesContainer = document.getElementById('schema-tables');
                    this.progressBar = document.getElementById('progress-bar');
                    
                    // Buttons
                    this.prevBtn = document.getElementById('prev-btn');
                    this.nextBtn = document.getElementById('next-btn');
                    this.checkAnswerBtn = document.getElementById('check-answer-btn');
                    this.resetBtn = document.getElementById('reset-quiz');
                    
                    // Event listeners
                    this.prevBtn.addEventListener('click', () => this.navigateQuestion(-1));
                    this.nextBtn.addEventListener('click', () => this.navigateQuestion(1));
                    this.checkAnswerBtn.addEventListener('click', () => this.checkAnswer());
                    this.resetBtn.addEventListener('click', () => this.resetQuiz());
                }
                
                initialize() {
                    // Setup database
                    this.setupDatabase();
                    
                    // Load questions
                    this.setupQuestions();
                    
                    // Randomize questions
                    this.randomizeQuestions();
                    
                    // Display schema
                    this.displayDatabaseSchema();
                    
                    // Display relationship diagram
                    this.displayRelationshipDiagram();
                    
                    // Show first question
                    this.displayQuestion();
                    
                    // Update progress bar
                    this.updateProgress();
                }

                randomizeQuestions() {
                    // Create an array of indices and shuffle it
                    this.questionOrder = [...Array(this.questions.length).keys()];
                    this.shuffleArray(this.questionOrder);
                    
                    // Initialize user answers array based on randomized order
                    this.userAnswers = new Array(this.questions.length).fill(null);
                }
                
                // Fisher-Yates shuffle algorithm
                shuffleArray(array) {
                    for (let i = array.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [array[i], array[j]] = [array[j], array[i]];
                    }
                }
                
                setupDatabase() {
                    // Create customers table
                    this.db.run(`
                        CREATE TABLE customers (
                            customer_id INTEGER PRIMARY KEY,
                            first_name TEXT,
                            last_name TEXT,
                            email TEXT,
                            city TEXT,
                            state TEXT,
                            country TEXT,
                            registration_date TEXT
                        )
                    `);
                    
                    // Insert sample customers
                    const customerData = [
                        [1, 'John', 'Smith', 'john.smith@example.com', 'New York', 'NY', 'USA', '2022-01-15'],
                        [2, 'Emily', 'Johnson', 'emily.j@example.com', 'Toronto', 'ON', 'Canada', '2022-02-20'],
                        [3, 'Michael', 'Williams', 'michael.w@example.com', 'Chicago', 'IL', 'USA', '2022-03-10'],
                        [4, 'Sophia', 'Brown', 'sophia.b@example.com', 'London', 'UK', 'UK', '2022-01-05'],
                        [5, 'Daniel', 'Jones', 'daniel.j@example.com', 'Sydney', 'NSW', 'Australia', '2022-04-12'],
                        [6, 'Olivia', 'Garcia', 'olivia.g@example.com', 'Madrid', 'MD', 'Spain', '2022-02-28'],
                        [7, 'James', 'Miller', 'james.m@example.com', 'Los Angeles', 'CA', 'USA', '2022-05-17'],
                        [8, 'Emma', 'Davis', 'emma.d@example.com', 'Vancouver', 'BC', 'Canada', '2022-06-23']
                    ];
                    
                    customerData.forEach(customer => {
                        this.db.run(
                            'INSERT INTO customers VALUES (?, ?, ?, ?, ?, ?, ?, ?)',
                            customer
                        );
                    });
                    
                    // Create products table
                    this.db.run(`
                        CREATE TABLE products (
                            product_id INTEGER PRIMARY KEY,
                            product_name TEXT,
                            category TEXT,
                            price REAL,
                            stock_quantity INTEGER
                        )
                    `);
                    
                    // Insert sample products
                    const productData = [
                        [1, 'Laptop Pro', 'Electronics', 1299.99, 50],
                        [2, 'Smartphone X', 'Electronics', 899.99, 100],
                        [3, 'Wireless Headphones', 'Electronics', 199.99, 75],
                        [4, 'Designer T-shirt', 'Clothing', 49.99, 200],
                        [5, 'Premium Jeans', 'Clothing', 89.99, 150],
                        [6, 'Running Shoes', 'Footwear', 129.99, 80],
                        [7, 'Coffee Table', 'Furniture', 249.99, 30],
                        [8, 'Desk Chair', 'Furniture', 179.99, 40],
                        [9, 'Blender', 'Kitchen', 89.99, 60],
                        [10, 'Toaster', 'Kitchen', 59.99, 70]
                    ];
                    
                    productData.forEach(product => {
                        this.db.run(
                            'INSERT INTO products VALUES (?, ?, ?, ?, ?)',
                            product
                        );
                    });
                    
                    // Create orders table
                    this.db.run(`
                        CREATE TABLE orders (
                            order_id INTEGER PRIMARY KEY,
                            customer_id INTEGER,
                            order_date TEXT,
                            total_amount REAL,
                            status TEXT,
                            FOREIGN KEY (customer_id) REFERENCES customers(customer_id)
                        )
                    `);
                    
                    // Insert sample orders
                    const orderData = [
                        [1, 1, '2023-01-10', 1349.98, 'Delivered'],
                        [2, 2, '2023-01-15', 899.99, 'Delivered'],
                        [3, 3, '2023-02-05', 279.98, 'Shipped'],
                        [4, 4, '2023-02-10', 129.99, 'Delivered'],
                        [5, 5, '2023-02-20', 429.98, 'Processing'],
                        [6, 1, '2023-03-05', 139.98, 'Delivered'],
                        [7, 2, '2023-03-15', 249.99, 'Shipped'],
                        [8, 6, '2023-03-20', 159.98, 'Processing'],
                        [9, 7, '2023-04-10', 1099.98, 'Delivered'],
                        [10, 8, '2023-04-12', 229.98, 'Pending'],
                        [11, 3, '2023-05-05', 149.99, 'Shipped'],
                        [12, 4, '2023-05-10', 249.99, 'Delivered']
                    ];
                    
                    orderData.forEach(order => {
                        this.db.run(
                            'INSERT INTO orders VALUES (?, ?, ?, ?, ?)',
                            order
                        );
                    });
                    
                    // Create order_items table
                    this.db.run(`
                        CREATE TABLE order_items (
                            order_item_id INTEGER PRIMARY KEY,
                            order_id INTEGER,
                            product_id INTEGER,
                            quantity INTEGER,
                            unit_price REAL,
                            FOREIGN KEY (order_id) REFERENCES orders(order_id),
                            FOREIGN KEY (product_id) REFERENCES products(product_id)
                        )
                    `);
                    
                    // Insert sample order items
                    const orderItemData = [
                        [1, 1, 1, 1, 1299.99],
                        [2, 1, 4, 1, 49.99],
                        [3, 2, 2, 1, 899.99],
                        [4, 3, 3, 1, 199.99],
                        [5, 3, 4, 2, 39.99],
                        [6, 4, 6, 1, 129.99],
                        [7, 5, 7, 1, 249.99],
                        [8, 5, 8, 1, 179.99],
                        [9, 6, 4, 2, 49.99],
                        [10, 6, 5, 1, 39.99],
                        [11, 7, 7, 1, 249.99],
                        [12, 8, 4, 2, 49.99],
                        [13, 8, 6, 1, 59.99],
                        [14, 9, 1, 1, 999.99],
                        [15, 9, 2, 1, 99.99],
                        [16, 10, 9, 1, 89.99],
                        [17, 10, 10, 1, 139.99],
                        [18, 11, 3, 1, 149.99],
                        [19, 12, 7, 1, 249.99]
                    ];
                    
                    orderItemData.forEach(item => {
                        this.db.run(
                            'INSERT INTO order_items VALUES (?, ?, ?, ?, ?)',
                            item
                        );
                    });
                    
                    // Create employees table
                    this.db.run(`
                        CREATE TABLE employees (
                            employee_id INTEGER PRIMARY KEY,
                            first_name TEXT,
                            last_name TEXT,
                            department TEXT,
                            salary REAL,
                            hire_date TEXT
                        )
                    `);
                    
                    // Insert sample employees
                    const employeeData = [
                        [1, 'Robert', 'Anderson', 'Sales', 65000, '2021-01-15'],
                        [2, 'Jennifer', 'Thomas', 'Marketing', 72000, '2021-02-10'],
                        [3, 'William', 'Jackson', 'Sales', 68000, '2021-03-05'],
                        [4, 'Elizabeth', 'White', 'IT', 85000, '2021-01-20'],
                        [5, 'David', 'Harris', 'Finance', 78000, '2021-04-12'],
                        [6, 'Maria', 'Martin', 'HR', 62000, '2021-05-20'],
                        [7, 'Joseph', 'Thompson', 'IT', 88000, '2021-02-15'],
                        [8, 'Susan', 'Garcia', 'Marketing', 69000, '2021-06-10']
                    ];
                    
                    employeeData.forEach(employee => {
                        this.db.run(
                            'INSERT INTO employees VALUES (?, ?, ?, ?, ?, ?)',
                            employee
                        );
                    });
                }
                
                setupQuestions() {
                    this.questions = [
                        {
                            id: 1,
                            title: "Simple Selection",
                            description: "Retrieve all customers from the United States.",
                            level: "easy",
                            type: "multiple-choice",
                            options: [
                                "SELECT * FROM customers WHERE country = 'USA';",
                                "SELECT * FROM customers WHERE country = 'United States';",
                                "SELECT * FROM customers WHERE country LIKE '%USA%';",
                                "SELECT * FROM customers WHERE state IN ('NY', 'CA', 'IL');"
                            ],
                            correctAnswer: 0,
                            explanation: "To select all customers from a specific country, we use the WHERE clause with the exact country name."
                        },
                        {
                            id: 2,
                            title: "Ordering Results",
                            description: "Sort products by price from highest to lowest.",
                            level: "easy",
                            type: "drag-drop",
                            segments: [
                                "SELECT *",
                                "FROM products",
                                "ORDER BY price",
                                "DESC"
                            ],
                            correctOrder: [0, 1, 2, 3],
                            explanation: "To sort results in descending order, we use ORDER BY followed by the column name and the DESC keyword."
                        },
                        {
                            id: 3,
                            title: "Counting Results",
                            description: "Count how many customers are from each country.",
                            level: "medium",
                            type: "fill-in-blanks",
                            template: "SELECT [blank1] FROM customers [blank2] BY country;",
                            blanks: {
                                blank1: ["country, COUNT(*)", "country", "COUNT(*)", "COUNT(country)"],
                                blank2: ["GROUP", "ORDER", "SORT", "FILTER"]
                            },
                            correctAnswers: {
                                blank1: "country, COUNT(*)",
                                blank2: "GROUP"
                            },
                            explanation: "To count items by group, we use the COUNT() aggregate function with GROUP BY clause."
                        },
                        {
                            id: 4,
                            title: "Basic JOIN",
                            description: "Retrieve customer names along with their order information.",
                            level: "medium",
                            type: "build-query",
                            segments: [
                                {type: "static", value: "SELECT"},
                                {type: "select", options: ["*", "c.first_name, c.last_name, o.order_id, o.order_date", "customers.*, orders.*", "c.customer_id, o.order_id"]},
                                {type: "static", value: "FROM"},
                                {type: "select", options: ["customers", "orders", "products", "order_items"]},
                                {type: "static", value: "c"},
                                {type: "select", options: ["JOIN", "INNER JOIN", "LEFT JOIN", "RIGHT JOIN"]},
                                {type: "select", options: ["customers", "orders", "products", "order_items"]},
                                {type: "static", value: "o ON c.customer_id = o.customer_id;"}
                            ],
                            correctAnswers: [1, 0, 1, 1],
                            explanation: "To join two tables, we need to specify the columns we want, the tables to join, and the condition on which to join them."
                        },
                        {
                            id: 5,
                            title: "Filtering with Multiple Conditions",
                            description: "Find all orders that were placed in the first quarter of 2023 (Jan-Mar) and have a total amount greater than $200.",
                            level: "medium",
                            type: "multiple-choice",

                displayDatabaseSchema() {

                    // Create HTML for each table
                    const schemaHtml = tables.map(table => {
                        const tableName = table[0];
                        
                        // Get table columns
                        const pragma = this.db.exec(`PRAGMA table_info(${tableName})`)[0];
                        
                        // Create HTML for the table schema
                        let html = `

                                <div class="schema-table-header" data-table="${tableName}">

                displayQuestion() {
                    if (this.questions.length === 0) return;
                    
                    // Clear any previous feedback
                    const feedback = document.querySelector('.feedback');
                    if (feedback) feedback.remove();
                    
                    // Get the current question based on randomized order
                    const questionIndex = this.questionOrder[this.currentQuestionIndex];
                    const question = this.questions[questionIndex];
                    
                    this.questionTitle.textContent = question.title;
                    this.questionCounter.textContent = `${this.currentQuestionIndex + 1}/${this.questions.length}`;
                    
                    // Add level indicator
                    const levelClass = `level-${question.level}`;
                    this.questionTitle.innerHTML = `${question.title} <span class="level-badge ${levelClass}">${question.level}</span>`;
                    
                    // Create HTML based on question type
                    let html = `<p class="mb-3">${question.description}</p>`;
                    
                    switch (question.type) {
                        case 'multiple-choice':
                            html += this.createMultipleChoiceHtml(question);
                            break;
                        case 'drag-drop':
                            html += this.createDragDropHtml(question);
                            break;
                        case 'fill-in-blanks':
                            html += this.createFillInBlanksHtml(question);
                            break;
                        case 'build-query':
                            html += this.createBuildQueryHtml(question);
                            break;
                    }
                    
                    this.questionContent.innerHTML = html;
                    
                    // Reset the check answer button
                    this.checkAnswerBtn.disabled = false;
                    
                    // Clear previous results
                    if (!this.answeredQuestions.has(this.currentQuestionIndex)) {
                        this.resultsContent.innerHTML = `
                            <div class="alert alert-info">
                                Results will appear here after you run a query.
                            </div>
                        `;
                        this.chartContainer.innerHTML = '';
                    }
                    
                    // Add event handlers based on question type
                    switch (question.type) {
                        case 'multiple-choice':
                            this.setupMultipleChoiceHandlers();
                            break;
                        case 'drag-drop':
                            this.setupDragDropHandlers();
                            break;
                        case 'fill-in-blanks':
                            this.setupFillInBlanksHandlers();
                            break;
                        case 'build-query':
                            this.setupBuildQueryHandlers();
                            break;
                    }
                    
                    // Restore previous answer if exists
                    if (this.userAnswers[this.currentQuestionIndex] !== null) {
                        this.restorePreviousAnswer();
                        
                        // If this question was already answered, disable the check button
                        if (this.answeredQuestions.has(this.currentQuestionIndex)) {
                            this.checkAnswerBtn.disabled = true;
                        }
                    }
                    
                    // Update button states
                    this.updateNavigationButtons();
                }
                
                createMultipleChoiceHtml(question) {
                    let html = '<div class="multiple-choice">';
                    
                    question.options.forEach((option, index) => {
                        html += `
                            <div class="choice-option" data-index="${index}">
                                <div class="sql-snippet">${option}</div>
                            </div>
                        `;
                    });
                    
                    html += '</div>';
                    return html;
                }
                
                createDragDropHtml(question) {
                    let html = `
                        <div class="drag-drop-container">
                            <p class="mb-2">Arrange the following segments in the correct order:</p>
                            <div class="drop-area mb-3" id="drop-area"></div>
                            <div class="drag-options">
                    `;
                    
                    // Create shuffled version of segments for dragging
                    const shuffledIndices = [...Array(question.segments.length).keys()];
                    for (let i = shuffledIndices.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [shuffledIndices[i], shuffledIndices[j]] = [shuffledIndices[j], shuffledIndices[i]];
                    }
                    
                    shuffledIndices.forEach(index => {
                        html += `
                            <div class="drag-option" draggable="true" data-index="${index}">
                                ${question.segments[index]}
                            </div>
                        `;
                    });
                    
                    html += `
                            </div>
                        </div>
                    `;
                    
                    return html;
                }
                
                createFillInBlanksHtml(question) {
                    let html = `<div class="fill-in-blanks-container">`;
                    
                    // Split the template by blanks
                    const parts = question.template.split(/\[blank\d+\]/g);
                    const blanks = question.template.match(/\[blank\d+\]/g) || [];
                    
                    html += '<div class="sql-snippet mb-3">';
                    
                    // Build the template with dropdown blanks
                    for (let i = 0; i < parts.length; i++) {
                        html += parts[i];
                        
                        if (i < blanks.length) {
                            const blankName = blanks[i].replace(/[\[\]]/g, '');
                            const options = question.blanks[blankName];
                            
                            html += `<select class="form-select-sm d-inline-block mx-1" style="width: auto;" data-blank="${blankName}">`;
                            html += `<option value="">-- Select --</option>`;
                            
                            options.forEach(option => {
                                html += `<option value="${option}">${option}</option>`;
                            });
                            
                            html += `</select>`;
                        }
                    }
                    
                    html += '</div></div>';
                    return html;
                }
                
                createBuildQueryHtml(question) {
                    let html = `
                        <div class="build-query-container">
                            <p class="mb-2">Build the SQL query by selecting the correct options:</p>
                            <div class="query-builder">
                    `;
                    
                    // Create the query builder with segments and dropdowns
                    question.segments.forEach((segment, index) => {
                        if (segment.type === 'static') {
                            html += `<span class="query-segment">${segment.value}</span>`;
                        } else if (segment.type === 'select') {
                            html += `
                                <span class="segment-dropdown">
                                    <select class="form-select-sm d-inline-block" data-index="${index}">
                                        <option value="">-- Select --</option>
                            `;
                            
                            segment.options.forEach((option, optIndex) => {
                                html += `<option value="${optIndex}">${option}</option>`;
                            });
                            
                            html += `
                                    </select>
                                </span>
                            `;
                        }
                    });
                    
                    html += `
                            </div>
                        </div>
                    `;
                    
                    return html;
                }
                
                setupMultipleChoiceHandlers() {
                    document.querySelectorAll('.choice-option').forEach(option => {
                        option.addEventListener('click', () => {
                            // Remove selected class from all options
                            document.querySelectorAll('.choice-option').forEach(opt => {
                                opt.classList.remove('selected');
                            });
                            
                            // Add selected class to clicked option
                            option.classList.add('selected');
                            
                            // Save the answer
                            this.userAnswers[this.currentQuestionIndex] = parseInt(option.dataset.index);
                        });
                    });
                }
                
                setupDragDropHandlers() {
                    const dragOptions = document.querySelectorAll('.drag-option');
                    const dropArea = document.getElementById('drop-area');
                    
                    // Initialize drag options
                    dragOptions.forEach(option => {
                        option.addEventListener('dragstart', e => {
                            e.dataTransfer.setData('text/plain', option.dataset.index);
                        });
                    });
                    
                    // Initialize drop area
                    dropArea.addEventListener('dragover', e => {
                        e.preventDefault();
                        dropArea.classList.add('active');
                    });
                    
                    dropArea.addEventListener('dragleave', () => {
                        dropArea.classList.remove('active');
                    });
                    
                    dropArea.addEventListener('drop', e => {
                        e.preventDefault();
                        dropArea.classList.remove('active');
                        
                        const index = e.dataTransfer.getData('text/plain');
                        const option = document.querySelector(`.drag-option[data-index="${index}"]`);
                        
                        if (option) {
                            // Clone the option to the drop area
                            const clone = option.cloneNode(true);
                            clone.setAttribute('draggable', 'false');
                            clone.classList.add('dropped');
                            
                            // Add a remove button
                            const removeBtn = document.createElement('button');
                            removeBtn.className = 'btn btn-sm btn-danger';
                            removeBtn.innerHTML = '<i class="fas fa-times"></i>';
                            removeBtn.addEventListener('click', () => {
                                clone.remove();
                                option.style.display = 'block';
                                this.updateDragDropAnswer();
                            });
                            
                            clone.appendChild(removeBtn);
                            dropArea.appendChild(clone);
                            
                            // Hide the original option
                            option.style.display = 'none';
                            
                            // Update the answer
                            this.updateDragDropAnswer();
                        }
                    });
                }
                
                updateDragDropAnswer() {
                    const droppedOptions = document.querySelectorAll('#drop-area .drag-option');
                    const answer = Array.from(droppedOptions).map(option => parseInt(option.dataset.index));
                    this.userAnswers[this.currentQuestionIndex] = answer;
                }
                
                setupFillInBlanksHandlers() {
                    document.querySelectorAll('.fill-in-blanks-container select').forEach(select => {
                        select.addEventListener('change', () => {
                            // Gather all selections
                            const selections = {};
                            document.querySelectorAll('.fill-in-blanks-container select').forEach(sel => {
                                selections[sel.dataset.blank] = sel.value;
                            });
                            
                            // Save the answer
                            this.userAnswers[this.currentQuestionIndex] = selections;
                        });
                    });
                }
                
                setupBuildQueryHandlers() {
                    document.querySelectorAll('.build-query-container select').forEach(select => {
                        select.addEventListener('change', () => {
                            // Gather all selections
                            const selections = [];
                            document.querySelectorAll('.build-query-container select').forEach(sel => {
                                if (sel.value) {
                                    selections[parseInt(sel.dataset.index)] = parseInt(sel.value);
                                }
                            });
                            
                            // Save the answer
                            this.userAnswers[this.currentQuestionIndex] = selections;
                        });
                    });
                }
                
                restorePreviousAnswer() {
                    const answer = this.userAnswers[this.currentQuestionIndex];
                    const questionIndex = this.questionOrder[this.currentQuestionIndex];
                    const question = this.questions[questionIndex];
                    
                    if (answer === null) return;
                    
                    switch (question.type) {
                        case 'multiple-choice':
                            document.querySelector(`.choice-option[data-index="${answer}"]`)?.classList.add('selected');
                            break;
                            
                        case 'drag-drop':
                            // For simplicity, we'll just display the feedback for drag-drop
                            // Full restoration would be more complex
                            if (this.answeredQuestions.has(this.currentQuestionIndex)) {
                                this.showDragDropFeedback(question, answer);
                            }
                            break;
                            
                        case 'fill-in-blanks':
                            // Restore dropdown selections
                            for (const [blank, value] of Object.entries(answer)) {
                                const dropdown = document.querySelector(`select[data-blank="${blank}"]`);
                                if (dropdown) dropdown.value = value;
                            }
                            break;
                            
                        case 'build-query':
                            // Restore dropdown selections
                            for (let i = 0; i < answer.length; i++) {
                                if (answer[i] !== undefined) {
                                    const dropdown = document.querySelector(`select[data-index="${i}"]`);
                                    if (dropdown) dropdown.value = answer[i];
                                }
                            }
                            break;
                    }
                }
                
                showDragDropFeedback(question, userAnswer) {
                    // This is a simplified approach to show feedback for drag-drop questions
                    // when restoring a previously answered question
                    let correctQuery = question.segments.join(' ');
                    let userQuery = userAnswer.map(index => question.segments[index]).join(' ');
                    let isCorrect = JSON.stringify(userAnswer) === JSON.stringify(question.correctOrder);
                    
                    let feedbackHtml = `
                        <div class="feedback ${isCorrect ? 'correct' : 'incorrect'}">
                            <h5><i class="fas ${isCorrect ? 'fa-check-circle' : 'fa-times-circle'} me-2"></i>${isCorrect ? 'Correct!' : 'Incorrect'}</h5>
                            <p>${question.explanation}</p>
                            <div class="mt-3">
                                <strong>Correct query:</strong>
                                <div class="sql-snippet">${correctQuery}</div>
                            </div>
                    `;
                    
                    if (!isCorrect) {
                        feedbackHtml += `
                            <div class="mt-3">
                                <strong>Your query:</strong>
                                <div class="sql-snippet">${userQuery}</div>
                            </div>
                        `;
                    }
                    
                    feedbackHtml += `</div>`;
                    
                    // Add feedback to the question content
                    this.questionContent.innerHTML += feedbackHtml;
                }
                
                navigateQuestion(direction) {
                    this.currentQuestionIndex += direction;
                    
                    // Ensure index is within bounds
                    if (this.currentQuestionIndex < 0) {
                        this.currentQuestionIndex = 0;
                    } else if (this.currentQuestionIndex >= this.questions.length) {
                        this.currentQuestionIndex = this.questions.length - 1;
                    }
                    
                    // Display the current question
                    this.displayQuestion();
                    
                    // Update progress
                    this.updateProgress();
                }
                
                updateNavigationButtons() {
                    // Update previous button
                    if (this.currentQuestionIndex === 0) {
                        this.prevBtn.disabled = true;
                    } else {
                        this.prevBtn.disabled = false;
                    }
                    
                    // Update next button
                    if (this.currentQuestionIndex === this.questions.length - 1) {
                        this.nextBtn.disabled = true;
                    } else {
                        this.nextBtn.disabled = false;
                    }
                }
                
                updateProgress() {
                    // Calculate progress percentage
                    const progress = ((this.currentQuestionIndex + 1) / this.questions.length) * 100;
                    this.progressBar.style.width = `${progress}%`;
                }
                
                checkAnswer() {
                    const questionIndex = this.questionOrder[this.currentQuestionIndex];
                    const question = this.questions[questionIndex];
                    const userAnswer = this.userAnswers[this.currentQuestionIndex];
                    
                    if (userAnswer === null) {
                        showToast('Please provide an answer before checking', 'warning');
                        return;
                    }
                    
                    // Add this question to answered set
                    this.answeredQuestions.add(this.currentQuestionIndex);
                    
                    let isCorrect = false;
                    let correctQuery = '';
                    let userQuery = '';
                    
                    switch (question.type) {
                        case 'multiple-choice':
                            isCorrect = userAnswer === question.correctAnswer;
                            correctQuery = question.options[question.correctAnswer];
                            userQuery = question.options[userAnswer];
                            
                            // Highlight correct and incorrect answers
                            document.querySelectorAll('.choice-option').forEach((option, index) => {
                                if (index === question.correctAnswer) {
                                    option.classList.add('correct');
                                } else if (index === userAnswer && !isCorrect) {
                                    option.classList.add('incorrect');
                                }
                            });
                            break;
                            
                        case 'drag-drop':
                            // Compare user order with correct order
                            isCorrect = JSON.stringify(userAnswer) === JSON.stringify(question.correctOrder);
                            correctQuery = question.segments.join(' ');
                            userQuery = userAnswer.map(index => question.segments[index]).join(' ');
                            break;
                            
                        case 'fill-in-blanks':
                            // Check if all blanks match correct answers
                            isCorrect = Object.entries(question.correctAnswers).every(
                                ([blank, correct]) => userAnswer[blank] === correct
                            );
                            
                            // Construct the correct query
                            let correctQueryParts = question.template;
                            for (const [blank, value] of Object.entries(question.correctAnswers)) {
                                correctQueryParts = correctQueryParts.replace(`[${blank}]`, value);
                            }
                            correctQuery = correctQueryParts;
                            // Construct the user query
                            let userQueryParts = question.template;
                            for (const [blank, value] of Object.entries(userAnswer)) {
                                userQueryParts = userQueryParts.replace(`[${blank}]`, value || '[empty]');
                            }
                            userQuery = userQueryParts;
                            break;
                            
                        case 'build-query':
                            // Check if selected options match correct answers
                            isCorrect = question.correctAnswers.every((correct, index) => 
                                userAnswer[index] === correct
                            );
                            
                            // Construct the correct query
                            correctQuery = question.segments.map((segment, index) => {
                                if (segment.type === 'static') return segment.value;
                                return segment.options[question.correctAnswers[index]];
                            }).join(' ');
                            
                            // Construct the user query
                            userQuery = question.segments.map((segment, index) => {
                                if (segment.type === 'static') return segment.value;
                                return segment.options[userAnswer[index]] || '[empty]';
                            }).join(' ');
                            break;
                    }
                    
                    // Display feedback
                    let feedbackHtml = `
                        <div class="feedback ${isCorrect ? 'correct' : 'incorrect'}">
                            <h5><i class="fas ${isCorrect ? 'fa-check-circle' : 'fa-times-circle'} me-2"></i>${isCorrect ? 'Correct!' : 'Incorrect'}</h5>
                            <p>${question.explanation}</p>
                            <div class="mt-3">
                                <strong>Correct query:</strong>
                                <div class="sql-snippet">${correctQuery}</div>
                            </div>
                    `;
                    
                    if (!isCorrect) {
                        feedbackHtml += `
                            <div class="mt-3">
                                <strong>Your query:</strong>
                                <div class="sql-snippet">${userQuery}</div>
                            </div>
                        `;
                    }
                    
                    feedbackHtml += `</div>`;
                    
                    // Add feedback to the question content
                    this.questionContent.innerHTML += feedbackHtml;
                    
                    // Execute the correct query and display results
                    this.executeQueryAndDisplay(correctQuery);
                    
                    // Disable check button after showing answer
                    this.checkAnswerBtn.disabled = true;
                    
                    // Update score if correct
                    if (isCorrect) {
                        this.score++;
                    }
                }
                
                executeQueryAndDisplay(query) {
                    try {
                        // Execute query
                        const results = this.db.exec(query);
                        
                        if (results.length === 0) {
                            // Query executed but no results (e.g., INSERT, UPDATE)
                            this.resultsContent.innerHTML = `
                                <div class="alert alert-success">
                                    Query executed successfully. No results returned.
                                </div>
                            `;
                            // Clear any existing chart
                            this.chartContainer.innerHTML = '';
                            return;
                        }
                        
                        // Get query results
                        const columns = results[0].columns;
                        const values = results[0].values;
                        
                        // Create table for results
                        let tableHtml = `
                            <div class="table-container">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                        `;
                        
                        // Add table headers
                        columns.forEach(col => {
                            tableHtml += `<th>${col}</th>`;
                        });
                        
                        tableHtml += `
                                        </tr>
                                    </thead>
                                    <tbody>
                        `;
                        
                        // Add table rows
                        values.forEach(row => {
                            tableHtml += '<tr>';
                            row.forEach(cell => {
                                tableHtml += `<td>${cell !== null ? cell : 'NULL'}</td>`;
                            });
                            tableHtml += '</tr>';
                        });
                        
                        tableHtml += `
                                    </tbody>
                                </table>
                            </div>
                            <p>${values.length} row(s) returned</p>
                        `;
                        
                        this.resultsContent.innerHTML = tableHtml;
                        
                        // Create visualization if appropriate
                        this.createVisualization(query, results[0]);
                        
                    } catch (error) {
                        // Query execution failed
                        this.resultsContent.innerHTML = `
                            <div class="alert alert-danger">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                Error executing query: ${error.message}
                            </div>
                        `;
                        // Clear any existing chart
                        this.chartContainer.innerHTML = '';
                    }
                }
                
                createVisualization(query, results) {
                    // Clear previous chart
                    this.chartContainer.innerHTML = '';
                    
                    // Check if results can be visualized
                    if (!results || results.values.length === 0) return;
                    
                    // Determine if this query is good for visualization
                    const columns = results.columns;
                    const values = results.values;
                    
                    // Simple heuristic: If we have 2+ columns and one looks like a category and another is numeric
                    if (columns.length >= 2) {
                        const possibleChartTypes = [];
                        
                        // Check for aggregations (COUNT, SUM, AVG, etc.)
                        const hasAggregation = query.toUpperCase().includes('COUNT(') || 
                                             query.toUpperCase().includes('SUM(') ||
                                             query.toUpperCase().includes('AVG(') ||
                                             query.toUpperCase().includes('MIN(') ||
                                             query.toUpperCase().includes('MAX(');
                        
                        // Check if we have a GROUP BY
                        const hasGroupBy = query.toUpperCase().includes('GROUP BY');
                        
                        // If we have aggregation and group by, this is likely a good candidate for a bar chart
                        if (hasAggregation && hasGroupBy) {
                            possibleChartTypes.push('bar');
                        }
                        
                        // If we have few rows and mostly text columns, a pie chart might be good
                        if (values.length <= 8 && 
                            columns.find(col => 
                                values.every(row => typeof row[columns.indexOf(col)] === 'string' || 
                                           typeof row[columns.indexOf(col)] === 'number'))) {
                            possibleChartTypes.push('pie');
                        }
                        
                        // If we have a date/time column and a numeric column, a line chart might be good
                        if (columns.find(col => values.some(row => row[columns.indexOf(col)]?.toString().match(/^\d{4}-\d{2}-\d{2}/))) &&
                            columns.find(col => values.every(row => typeof row[columns.indexOf(col)] === 'number' || 
                                           (!isNaN(parseFloat(row[columns.indexOf(col)])) && row[columns.indexOf(col)] !== null)))) {
                            possibleChartTypes.push('line');
                        }
                        
                        // Default to bar chart if possible
                        const chartType = possibleChartTypes.includes('bar') ? 'bar' : 
                                         (possibleChartTypes.includes('pie') ? 'pie' : 
                                         (possibleChartTypes.includes('line') ? 'line' : null));
                        
                        if (chartType) {
                            // Create canvas for chart
                            const canvas = document.createElement('canvas');
                            this.chartContainer.appendChild(canvas);
                            
                            // Determine which columns to use
                            let labelColumn = 0;
                            let dataColumn = 1;
                            
                            // Find a suitable label column (preferably text)
                            for (let i = 0; i < columns.length; i++) {
                                if (values.every(row => typeof row[i] === 'string')) {
                                    labelColumn = i;
                                    break;
                                }
                            }
                            
                            // Find a suitable data column (must be numeric)
                            for (let i = 0; i < columns.length; i++) {
                                if (i !== labelColumn && values.every(row => 
                                    typeof row[i] === 'number' || 
                                    (!isNaN(parseFloat(row[i])) && row[i] !== null))) {
                                    dataColumn = i;
                                    break;
                                }
                            }
                            
                            // Extract data
                            const labels = values.map(row => row[labelColumn]);
                            const data = values.map(row => parseFloat(row[dataColumn]));
                            
                            // Create chart
                            new Chart(canvas, {
                                type: chartType,
                                data: {
                                    labels: labels,
                                    datasets: [{
                                        label: columns[dataColumn],
                                        data: data,
                                        backgroundColor: chartType === 'line' ? 'rgba(67, 97, 238, 0.2)' : 
                                            labels.map((_, i) => {
                                                const hue = (i * 30) % 360;
                                                return chartType === 'pie' ? 
                                                    `hsl(${hue}, 70%, 60%)` : 
                                                    `rgba(67, 97, 238, ${0.5 + (i * 0.5 / labels.length)})`;
                                            }),
                                        borderColor: chartType === 'line' ? 'rgba(67, 97, 238, 1)' : 
                                            labels.map((_, i) => {
                                                const hue = (i * 30) % 360;
                                                return chartType === 'pie' ? 
                                                    `hsl(${hue}, 70%, 50%)` : 
                                                    'rgba(67, 97, 238, 1)';
                                            }),
                                        borderWidth: 1
                                    }]
                                },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    scales: {
                                        y: {
                                            beginAtZero: true,
                                            display: chartType !== 'pie'
                                        },
                                        x: {
                                            display: chartType !== 'pie'
                                        }
                                    }
                                }
                            });
                        }
                    }
                }
                
                resetQuiz() {
                    // Confirm reset
                    if (confirm('Are you sure you want to reset the quiz? Your progress will be lost.')) {
                        // Re-randomize questions
                        this.randomizeQuestions();
                        
                        // Reset current state
                        this.currentQuestionIndex = 0;
                        this.score = 0;
                        this.answeredQuestions = new Set();
                        this.checkAnswerBtn.disabled = false;
                        
                        // Clear results
                        this.resultsContent.innerHTML = `
                            <div class="alert alert-info">
                                Results will appear here after you run a query.
                            </div>
                        `;
                        
                        // Clear chart
                        this.chartContainer.innerHTML = '';
                        
                        // Display first question
                        this.displayQuestion();
                        
                        // Update progress bar
                        this.updateProgress();
                        
                        showToast('Quiz has been reset with new questions', 'success');
                    }
                }
            }
        });
        
        // Toast notification function
        function showToast(message, type = 'info') {
            const toastContainer = document.querySelector('.toast-container');
            
            const toast = document.createElement('div');
            toast.className = `toast show`;
            toast.innerHTML = `
                <div class="toast-header bg-${type} text-white">
                    <strong class="me-auto">
                        <i class="fas ${type === 'success' ? 'fa-check-circle' : 
                                      type === 'warning' ? 'fa-exclamation-triangle' : 
                                      type === 'danger' ? 'fa-times-circle' : 'fa-info-circle'} me-2"></i>
                        ${type.charAt(0).toUpperCase() + type.slice(1)}
                    </strong>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
                <div class="toast-body">
                    ${message}
                </div>
            `;
            
            toastContainer.appendChild(toast);
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (toastContainer.contains(toast)) {
                        toastContainer.removeChild(toast);
                    }
                }, 500);
            }, 5000);
            
            // Close button functionality
            const closeBtn = toast.querySelector('.btn-close');
            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    toast.classList.remove('show');
                    setTimeout(() => {
                        if (toastContainer.contains(toast)) {
                            toastContainer.removeChild(toast);
                        }
                    }, 500);
                });
            }
        }
    </script>
