<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Learning Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --success: #06d6a0;
            --info: #4cc9f0;
            --warning: #f9c74f;
            --danger: #ef476f;
            --light: #f8f9fa;
            --dark: #212529;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fb;
            min-height: 100vh;
        }
        
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }
        
        .quiz-area {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .db-schema {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .schema-table {
            margin-bottom: 15px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .schema-table-header {
            background-color: #f1f3f5;
            padding: 10px 15px;
            font-weight: bold;
            border-bottom: 1px solid #dee2e6;
            cursor: pointer;
        }
        
        .schema-table-content {
            padding: 15px;
            display: none;
            background-color: #fafafa;
        }
        
        .schema-table-content.active {
            display: block;
        }
        
        .results-area {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
            min-height: 300px;
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #dee2e6;
        }
        
        .question-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin: 0;
        }
        
        .question-counter {
            background-color: var(--primary);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
        }
        
        .btn-primary:hover {
            background-color: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        
        .btn-success {
            background-color: var(--success);
            border-color: var(--success);
        }
        
        .badge-success {
            background-color: var(--success);
        }
        
        .badge-warning {
            background-color: var(--warning);
        }
        
        .badge-danger {
            background-color: var(--danger);
        }
        
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        
        .table {
            font-size: 0.9rem;
        }
        
        .progress {
            height: 10px;
            margin-bottom: 20px;
        }
        
        .drag-option {
            padding: 10px 15px;
            margin: 5px 0;
            border: 1px solid #ced4da;
            border-radius: 5px;
            background-color: #f8f9fa;
            cursor: move;
        }
        
        .drop-area {
            min-height: 50px;
            padding: 10px;
            border: 2px dashed #ced4da;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        
        .drop-area.active {
            border-color: var(--primary);
            background-color: rgba(67, 97, 238, 0.1);
        }
        
        .option-container {
            margin-bottom: 20px;
        }
        
        .option-badge {
            display: inline-block;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 25px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            background-color: #f1f3f5;
            border: 1px solid #dee2e6;
        }
        
        .option-badge:hover {
            background-color: #e9ecef;
            transform: translateY(-2px);
        }
        
        .option-badge.selected {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        .chart-container {
            height: 300px;
            margin-top: 20px;
        }
        
        .correct-answer {
            background-color: rgba(6, 214, 160, 0.2);
            border: 1px solid var(--success);
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
        
        .sql-snippet {
            font-family: monospace;
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 3px solid var(--primary);
        }
        
        .multiple-choice {
            margin-top: 20px;
        }
        
        .choice-option {
            display: block;
            padding: 10px 15px;
            margin: 10px 0;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .choice-option:hover {
            background-color: #f8f9fa;
        }
        
        .choice-option.selected {
            background-color: rgba(67, 97, 238, 0.1);
            border-color: var(--primary);
        }
        
        .choice-option.correct {
            background-color: rgba(6, 214, 160, 0.2);
            border-color: var(--success);
        }
        
        .choice-option.incorrect {
            background-color: rgba(239, 71, 111, 0.2);
            border-color: var(--danger);
        }
        
        .feedback {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
        }
        
        .feedback.correct {
            background-color: rgba(6, 214, 160, 0.2);
            border: 1px solid var(--success);
        }
        
        .feedback.incorrect {
            background-color: rgba(239, 71, 111, 0.2);
            border: 1px solid var(--danger);
        }
        
        .level-badge {
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 10px;
            margin-left: 10px;
            vertical-align: middle;
        }
        
        .level-easy {
            background-color: #d1fae5;
            color: #065f46;
        }
        
        .level-medium {
            background-color: #ffedd5;
            color: #9a3412;
        }
        
        .level-hard {
            background-color: #fee2e2;
            color: #b91c1c;
        }
        
        .db-visualization {
            margin-top: 20px;
            text-align: center;
        }
        
        .table-relation-diagram {
            max-width: 100%;
            margin: 0 auto;
            padding: 20px;
        }
        
        .query-builder {
            margin: 20px 0;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
            border: 1px solid #dee2e6;
        }
        
        .query-segment {
            display: inline-block;
            background-color: #e9ecef;
            padding: 5px 10px;
            border-radius: 4px;
            margin: 0 5px 5px 0;
        }
        
        .segment-dropdown {
            display: inline-block;
            margin: 0 5px 5px 0;
        }
        
        .query-result {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #dee2e6;
            background-color: white;
        }
        
        /* Toast notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
        }
        
        .toast {
            min-width: 250px;
        }
        
        /* Added for better drag and drop experience */
        .dropped {
            margin-bottom: 5px;
            position: relative;
            padding-right: 40px;
        }
        
        .dropped button {
            position: absolute;
            right: 5px;
            top: 5px;
        }
        
        /* SQL Query Builder */
        .sql-builder-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .builder-section {
            margin-bottom: 15px;
        }
        
        .builder-section label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        
        .builder-columns {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .column-option {
            background-color: #f1f3f5;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 8px 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .column-option:hover {
            background-color: #e9ecef;
        }
        
        .column-option.selected {
            background-color: rgba(67, 97, 238, 0.1);
            border-color: var(--primary);
        }
        
        .join-container {
            margin-top: 10px;
            display: none;
        }
        
        .join-container.active {
            display: block;
        }
        
        .sql-preview {
            font-family: monospace;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            border-left: 3px solid var(--primary);
            white-space: pre-wrap;
        }
        
        .nav-tabs {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar - Simplified -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-database me-2"></i>SQL Query Builder
            </a>
            <button id="reset-builder" class="btn btn-outline-light btn-sm">
                <i class="fas fa-undo me-1"></i>Reset Builder
            </button>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- SQL Query Builder Section - Now Main Focus -->
        <div id="sql-builder-section" class="sql-builder-container">
            <h4 class="mb-3">
                <i class="fas fa-tools me-2"></i>SQL Query Builder
            </h4>
            
            <ul class="nav nav-tabs" id="builder-tabs">
                <li class="nav-item">
                    <a class="nav-link active" id="select-tab" data-bs-toggle="tab" href="#select-content">SELECT</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="join-tab" data-bs-toggle="tab" href="#join-content">JOIN</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="where-tab" data-bs-toggle="tab" href="#where-content">WHERE</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="group-tab" data-bs-toggle="tab" href="#group-content">GROUP BY</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="order-tab" data-bs-toggle="tab" href="#order-content">ORDER BY</a>
                </li>
            </ul>
            
            <div class="tab-content">
                <!-- SELECT Tab -->
                <div class="tab-pane fade show active" id="select-content">
                    <div class="builder-section">
                        <label>Select Table:</label>
                        <select id="select-table" class="form-select">
                            <option value="">-- Select a table --</option>
                            <!-- Tables will be populated by JavaScript -->
                        </select>
                    </div>
                    
                    <div class="builder-section">
                        <label>Select Columns:</label>
                        <div id="select-columns" class="builder-columns">
                            <!-- Columns will be populated based on selected table -->
                        </div>
                    </div>
                </div>
                
                <!-- JOIN Tab -->
                <div class="tab-pane fade" id="join-content">
                    <div class="builder-section">
                        <label>Join Type:</label>
                        <select id="join-type" class="form-select">
                            <option value="INNER JOIN">INNER JOIN</option>
                            <option value="LEFT JOIN">LEFT JOIN</option>
                            <option value="RIGHT JOIN">RIGHT JOIN</option>
                            <option value="FULL JOIN">FULL JOIN</option>
                        </select>
                    </div>
                    
                    <div class="builder-section">
                        <label>Join Table:</label>
                        <select id="join-table" class="form-select">
                            <option value="">-- Select a table --</option>
                            <!-- Tables will be populated by JavaScript -->
                        </select>
                    </div>
                    
                    <div class="builder-section">
                        <label>ON Condition:</label>
                        <input type="text" id="join-condition" class="form-control" 
                               placeholder="e.g., table1.id = table2.table1_id">
                    </div>
                </div>
                
                <!-- WHERE Tab -->
                <div class="tab-pane fade" id="where-content">
                    <div class="builder-section">
                        <label>Where Condition:</label>
                        <input type="text" id="where-condition" class="form-control" 
                               placeholder="e.g., column > 100">
                    </div>
                </div>
                
                <!-- GROUP BY Tab -->
                <div class="tab-pane fade" id="group-content">
                    <div class="builder-section">
                        <label>Group By Column(s):</label>
                        <div id="group-columns" class="builder-columns">
                            <!-- Columns will be populated based on selected table -->
                        </div>
                    </div>
                    
                    <div class="builder-section">
                        <label>Having Condition:</label>
                        <input type="text" id="having-condition" class="form-control" 
                               placeholder="e.g., COUNT(*) > 5">
                    </div>
                </div>
                
                <!-- ORDER BY Tab -->
                <div class="tab-pane fade" id="order-content">
                    <div class="builder-section">
                        <label>Order By:</label>
                        <input type="text" id="order-column" class="form-control" 
                               placeholder="e.g., column_name">
                    </div>
                    
                    <div class="builder-section">
                        <select id="order-direction" class="form-select">
                            <option value="ASC">Ascending (ASC)</option>
                            <option value="DESC">Descending (DESC)</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="sql-preview" id="sql-preview">SELECT * FROM table</div>
            
            <div class="d-flex justify-content-end mt-3">
                <button id="run-builder-query" class="btn btn-success">
                    <i class="fas fa-play me-1"></i>Run Query
                </button>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-8">
                <div class="results-area">
                    <h4 class="mb-3">
                        <i class="fas fa-chart-bar me-2"></i>Results
                    </h4>
                    <div id="results-content">
                        <div class="alert alert-info">
                            Results will appear here after you run a query.
                        </div>
                    </div>
                    
                    <div id="chart-container" class="chart-container">
                        <!-- Chart will be displayed here -->
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="db-schema">
                    <h4 class="mb-3">
                        <i class="fas fa-table me-2"></i>Database Schema
                    </h4>
                    
                    <div id="schema-tables">
                        <!-- Schema tables will be loaded here -->
                    </div>
                    
                    <div class="db-visualization">
                        <h5 class="mb-3">Table Relationships</h5>
                        <div class="table-relation-diagram">
                            <!-- Table relationship diagram will be inserted here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast container for notifications -->
    <div class="toast-container"></div>

    <!-- Essential Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize SQL.js
            initSqlJs({
                locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
            }).then(SQL => {
                // Create a database
                const db = new SQL.Database();
                
                // Setup the database
                setupDatabase(db);
                
                // Initialize the query builder
                const builder = new SQLQueryBuilder(db);
                builder.initialize();
                
                // Display schema
                displayDatabaseSchema(db);
                
                // Display relationship diagram
                displayRelationshipDiagram();
                
            }).catch(err => {
                showToast('Error initializing SQL database: ' + err.message, 'danger');
            });

            // SQLQueryBuilder class
            class SQLQueryBuilder {
                constructor(db) {
                    this.db = db;
                    this.selectedTable = '';
                    this.selectedColumns = [];
                    this.joinType = 'INNER JOIN';
                    this.joinTable = '';
                    this.joinCondition = '';
                    this.whereCondition = '';
                    this.groupColumns = [];
                    this.havingCondition = '';
                    this.orderColumn = '';
                    this.orderDirection = 'ASC';
                    
                    // Builder elements
                    this.builderSection = document.getElementById('sql-builder-section');
                    this.resetBtn = document.getElementById('reset-builder');
                    this.runBtn = document.getElementById('run-builder-query');
                    
                    // SELECT tab elements
                    this.selectTableEl = document.getElementById('select-table');
                    this.selectColumnsEl = document.getElementById('select-columns');
                    
                    // JOIN tab elements
                    this.joinTypeEl = document.getElementById('join-type');
                    this.joinTableEl = document.getElementById('join-table');
                    this.joinConditionEl = document.getElementById('join-condition');
                    
                    // WHERE tab elements
                    this.whereConditionEl = document.getElementById('where-condition');
                    
                    // GROUP BY tab elements
                    this.groupColumnsEl = document.getElementById('group-columns');
                    this.havingConditionEl = document.getElementById('having-condition');
                    
                    // ORDER BY tab elements
                    this.orderColumnEl = document.getElementById('order-column');
                    this.orderDirectionEl = document.getElementById('order-direction');
                    
                    // SQL preview element
                    this.sqlPreviewEl = document.getElementById('sql-preview');
                    
                    // Results elements
                    this.resultsContent = document.getElementById('results-content');
                    this.chartContainer = document.getElementById('chart-container');
                }
                
                initialize() {
                    // Reset builder
                    this.resetBtn.addEventListener('click', () => {
                        this.resetBuilder();
                    });
                    
                    // Run query
                    this.runBtn.addEventListener('click', () => {
                        this.runQuery();
                    });
                    
                    // Add event listeners for form controls
                    this.selectTableEl.addEventListener('change', () => {
                        this.selectedTable = this.selectTableEl.value;
                        this.populateColumns();
                        this.updateSqlPreview();
                    });
                    
                    this.joinTypeEl.addEventListener('change', () => {
                        this.joinType = this.joinTypeEl.value;
                        this.updateSqlPreview();
                    });
                    
                    this.joinTableEl.addEventListener('change', () => {
                        this.joinTable = this.joinTableEl.value;
                        this.updateSqlPreview();
                    });
                    
                    this.joinConditionEl.addEventListener('input', () => {
                        this.joinCondition = this.joinConditionEl.value;
                        this.updateSqlPreview();
                    });
                    
                    this.whereConditionEl.addEventListener('input', () => {
                        this.whereCondition = this.whereConditionEl.value;
                        this.updateSqlPreview();
                    });
                    
                    this.havingConditionEl.addEventListener('input', () => {
                        this.havingCondition = this.havingConditionEl.value;
                        this.updateSqlPreview();
                    });
                    
                    this.orderColumnEl.addEventListener('input', () => {
                        this.orderColumn = this.orderColumnEl.value;
                        this.updateSqlPreview();
                    });
                    
                    this.orderDirectionEl.addEventListener('change', () => {
                        this.orderDirection = this.orderDirectionEl.value;
                        this.updateSqlPreview();
                    });
                    
                    // Populate tables on initialization
                    this.populateTables();
                }
                
                populateTables() {
                    // Clear existing options
                    this.selectTableEl.innerHTML = '<option value="">-- Select a table --</option>';
                    this.joinTableEl.innerHTML = '<option value="">-- Select a table --</option>';
                    
                    // Get tables from the database
                    try {
                        const tables = this.db.exec("SELECT name FROM sqlite_master WHERE type='table'")[0].values;
                        
                        // Add options for each table
                        tables.forEach(table => {
                            const tableName = table[0];
                            
                            // Add to SELECT table dropdown
                            const selectOption = document.createElement('option');
                            selectOption.value = tableName;
                            selectOption.textContent = tableName;
                            this.selectTableEl.appendChild(selectOption);
                            
                            // Add to JOIN table dropdown
                            const joinOption = document.createElement('option');
                            joinOption.value = tableName;
                            joinOption.textContent = tableName;
                            this.joinTableEl.appendChild(joinOption);
                        });
                    } catch (error) {
                        console.error('Error fetching tables:', error);
                    }
                }
                
                populateColumns() {
                    // Clear existing columns
                    this.selectColumnsEl.innerHTML = '';
                    this.groupColumnsEl.innerHTML = '';
                    this.selectedColumns = [];
                    this.groupColumns = [];
                    
                    if (!this.selectedTable) return;
                    
                    // Get columns for the selected table
                    try {
                        const pragma = this.db.exec(`PRAGMA table_info(${this.selectedTable})`)[0];
                        
                        // Create a clickable option for each column - SELECT columns
                        pragma.values.forEach(col => {
                            const colName = col[1];
                            const colType = col[2];
                            
                            // Create column option element for SELECT
                            const columnEl = document.createElement('div');
                            columnEl.className = 'column-option';
                            columnEl.dataset.column = `${this.selectedTable}.${colName}`;
                            columnEl.textContent = `${this.selectedTable}.${colName}`;
                            
                            // Add click event to toggle selection
                            columnEl.addEventListener('click', () => {
                                columnEl.classList.toggle('selected');
                                
                                if (columnEl.classList.contains('selected')) {
                                    this.selectedColumns.push(`${this.selectedTable}.${colName}`);
                                } else {
                                    this.selectedColumns = this.selectedColumns.filter(
                                        col => col !== `${this.selectedTable}.${colName}`
                                    );
                                }
                                
                                this.updateSqlPreview();
                            });
                            
                            this.selectColumnsEl.appendChild(columnEl);
                            
                            // Create column option element for GROUP BY
                            const groupColumnEl = document.createElement('div');
                            groupColumnEl.className = 'column-option';
                            groupColumnEl.dataset.column = `${this.selectedTable}.${colName}`;
                            groupColumnEl.textContent = `${this.selectedTable}.${colName}`;
                            
                            // Add click event to toggle group by selection
                            groupColumnEl.addEventListener('click', () => {
                                groupColumnEl.classList.toggle('selected');
                                
                                if (groupColumnEl.classList.contains('selected')) {
                                    this.groupColumns.push(`${this.selectedTable}.${colName}`);
                                } else {
                                    this.groupColumns = this.groupColumns.filter(
                                        col => col !== `${this.selectedTable}.${colName}`
                                    );
                                }
                                
                                this.updateSqlPreview();
                            });
                            
                            this.groupColumnsEl.appendChild(groupColumnEl);
                        });
                        
                        // Add aggregate function options for SELECT
                        const aggregateFunctions = [
                            'COUNT(*)',
                            'SUM',
                            'AVG',
                            'MIN',
                            'MAX'
                        ];
                        
                        const aggregateHeader = document.createElement('div');
                        aggregateHeader.className = 'mt-3 mb-2 fw-bold';
                        aggregateHeader.textContent = 'Aggregate Functions:';
                        this.selectColumnsEl.appendChild(aggregateHeader);
                        
                        aggregateFunctions.forEach(func => {
                            if (func === 'COUNT(*)') {
                                const countOption = document.createElement('div');
                                countOption.className = 'column-option';
                                countOption.dataset.column = func;
                                countOption.textContent = func;
                                
                                countOption.addEventListener('click', () => {
                                    countOption.classList.toggle('selected');
                                    
                                    if (countOption.classList.contains('selected')) {
                                        this.selectedColumns.push(func);
                                    } else {
                                        this.selectedColumns = this.selectedColumns.filter(
                                            col => col !== func
                                        );
                                    }
                                    
                                    this.updateSqlPreview();
                                });
                                
                                this.selectColumnsEl.appendChild(countOption);
                            } else {
                                pragma.values.forEach(col => {
                                    const colName = col[1];
                                    const colType = col[2];
                                    
                                    // Only show aggregate functions for numeric columns
                                    if (colType.includes('INT') || colType.includes('REAL') || 
                                        colType.includes('FLOAT') || colType.includes('DOUBLE') || 
                                        colType.includes('NUMERIC')) {
                                        
                                        const funcOption = document.createElement('div');
                                        funcOption.className = 'column-option';
                                        const funcText = `${func}(${this.selectedTable}.${colName})`;
                                        funcOption.dataset.column = funcText;
                                        funcOption.textContent = funcText;
                                        
                                        funcOption.addEventListener('click', () => {
                                            funcOption.classList.toggle('selected');
                                            
                                            if (funcOption.classList.contains('selected')) {
                                                this.selectedColumns.push(funcText);
                                            } else {
                                                this.selectedColumns = this.selectedColumns.filter(
                                                    col => col !== funcText
                                                );
                                            }
                                            
                                            this.updateSqlPreview();
                                        });
                                        
                                        this.selectColumnsEl.appendChild(funcOption);
                                    }
                                });
                            }
                        });
                    } catch (error) {
                        console.error('Error fetching columns:', error);
                    }
                }
                
                updateSqlPreview() {
                    let sql = 'SELECT ';
                    
                    // Add columns
                    if (this.selectedColumns.length > 0) {
                        sql += this.selectedColumns.join(', ');
                    } else {
                        sql += '*';
                    }
                    
                    // Add FROM clause
                    if (this.selectedTable) {
                        sql += ` FROM ${this.selectedTable}`;
                    } else {
                        sql += ' FROM table';
                    }
                    
                    // Add JOIN clause
                    if (this.joinTable && this.joinCondition) {
                        sql += `\n${this.joinType} ${this.joinTable}\nON ${this.joinCondition}`;
                    }
                    
                    // Add WHERE clause
                    if (this.whereCondition) {
                        sql += `\nWHERE ${this.whereCondition}`;
                    }
                    
                    // Add GROUP BY clause
                    if (this.groupColumns.length > 0) {
                        sql += `\nGROUP BY ${this.groupColumns.join(', ')}`;
                        
                        // Add HAVING clause
                        if (this.havingCondition) {
                            sql += `\nHAVING ${this.havingCondition}`;
                        }
                    }
                    
                    // Add ORDER BY clause
                    if (this.orderColumn) {
                        sql += `\nORDER BY ${this.orderColumn} ${this.orderDirection}`;
                    }
                    
                    // Update SQL preview
                    this.sqlPreviewEl.textContent = sql;
                }
                
                resetBuilder() {
                    // Reset all fields
                    this.selectedTable = '';
                    this.selectedColumns = [];
                    this.joinType = 'INNER JOIN';
                    this.joinTable = '';
                    this.joinCondition = '';
                    this.whereCondition = '';
                    this.groupColumns = [];
                    this.havingCondition = '';
                    this.orderColumn = '';
                    this.orderDirection = 'ASC';
                    
                    // Reset form controls
                    this.selectTableEl.value = '';
                    this.selectColumnsEl.innerHTML = '';
                    this.groupColumnsEl.innerHTML = '';
                    this.joinTypeEl.value = 'INNER JOIN';
                    this.joinTableEl.value = '';
                    this.joinConditionEl.value = '';
                    this.whereConditionEl.value = '';
                    this.havingConditionEl.value = '';
                    this.orderColumnEl.value = '';
                    this.orderDirectionEl.value = 'ASC';
                    
                    // Update SQL preview
                    this.updateSqlPreview();
                    
                    // Clear results
                    this.resultsContent.innerHTML = `
                        <div class="alert alert-info">
                            Results will appear here after you run a query.
                        </div>
                    `;
                    
                    // Clear chart
                    this.chartContainer.innerHTML = '';
                }
                
                runQuery() {
                    const sql = this.sqlPreviewEl.textContent;
                    
                    if (sql.trim() === '' || !this.selectedTable) {
                        showToast('Please select a table and build a valid query', 'warning');
                        return;
                    }
                    
                    try {
                        // Execute the query and display results
                        this.executeQueryAndDisplay(sql);
                        showToast('Query executed successfully', 'success');
                    } catch (error) {
                        showToast(`Error executing query: ${error.message}`, 'danger');
                    }
                }
                
                executeQueryAndDisplay(query) {
                    try {
                        // Execute query
                        const results = this.db.exec(query);
                        
                        if (results.length === 0) {
                            // Query executed but no results (e.g., INSERT, UPDATE)
                            this.resultsContent.innerHTML = `
                                <div class="alert alert-success">
                                    Query executed successfully. No results returned.
                                </div>
                            `;
                            // Clear any existing chart
                            this.chartContainer.innerHTML = '';
                            return;
                        }
                        
                        // Get query results
                        const columns = results[0].columns;
                        const values = results[0].values;
                        
                        // Create table for results
                        let tableHtml = `
                            <div class="table-container">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                        `;
                        
                        // Add table headers
                        columns.forEach(col => {
                            tableHtml += `<th>${col}</th>`;
                        });
                        
                        tableHtml += `
                                        </tr>
                                    </thead>
                                    <tbody>
                        `;
                        
                        // Add table rows
                        values.forEach(row => {
                            tableHtml += '<tr>';
                            row.forEach(cell => {
                                tableHtml += `<td>${cell !== null ? cell : 'NULL'}</td>`;
                            });
                            tableHtml += '</tr>';
                        });
                        
                        tableHtml += `
                                    </tbody>
                                </table>
                            </div>
                            <p>${values.length} row(s) returned</p>
                        `;
                        
                        this.resultsContent.innerHTML = tableHtml;
                        
                        // Create visualization if appropriate
                        this.createVisualization(query, results[0]);
                        
                    } catch (error) {
                        // Query execution failed
                        this.resultsContent.innerHTML = `
                            <div class="alert alert-danger">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                Error executing query: ${error.message}
                            </div>
                        `;
                        // Clear any existing chart
                        this.chartContainer.innerHTML = '';
                    }
                }
                
                createVisualization(query, results) {
                    // Clear previous chart
                    this.chartContainer.innerHTML = '';
                    
                    // Check if results can be visualized
                    if (!results || results.values.length === 0) return;
                    
                    // Determine if this query is good for visualization
                    const columns = results.columns;
                    const values = results.values;
                    
                    // Simple heuristic: If we have 2+ columns and one looks like a category and another is numeric
                    if (columns.length >= 2) {
                        const possibleChartTypes = [];
                        
                        // Check for aggregations (COUNT, SUM, AVG, etc.)
                        const hasAggregation = query.toUpperCase().includes('COUNT(') || 
                                             query.toUpperCase().includes('SUM(') ||
                                             query.toUpperCase().includes('AVG(') ||
                                             query.toUpperCase().includes('MIN(') ||
                                             query.toUpperCase().includes('MAX(');
                        
                        // Check if we have a GROUP BY
                        const hasGroupBy = query.toUpperCase().includes('GROUP BY');
                        
                        // If we have aggregation and group by, this is likely a good candidate for a bar chart
                        if (hasAggregation && hasGroupBy) {
                            possibleChartTypes.push('bar');
                        }
                        
                        // If we have few rows and mostly text columns, a pie chart might be good
                        if (values.length <= 8 && 
                            columns.find(col => 
                                values.every(row => typeof row[columns.indexOf(col)] === 'string' || 
                                           typeof row[columns.indexOf(col)] === 'number'))) {
                            possibleChartTypes.push('pie');
                        }
                        
                        // If we have a date/time column and a numeric column, a line chart might be good
                        if (columns.find(col => values.some(row => row[columns.indexOf(col)]?.toString().match(/^\d{4}-\d{2}-\d{2}/))) &&
                            columns.find(col => values.every(row => typeof row[columns.indexOf(col)] === 'number' || 
                                           (!isNaN(parseFloat(row[columns.indexOf(col)])) && row[columns.indexOf(col)] !== null)))) {
                            possibleChartTypes.push('line');
                        }
                        
                        // Default to bar chart if possible
                        const chartType = possibleChartTypes.includes('bar') ? 'bar' : 
                                         (possibleChartTypes.includes('pie') ? 'pie' : 
                                         (possibleChartTypes.includes('line') ? 'line' : null));
                        
                        if (chartType) {
                            // Create canvas for chart
                            const canvas = document.createElement('canvas');
                            this.chartContainer.appendChild(canvas);
                            
                            // Determine which columns to use
                            let labelColumn = 0;
                            let dataColumn = 1;
                            
                            // Find a suitable label column (preferably text)
                            for (let i = 0; i < columns.length; i++) {
                                if (values.every(row => typeof row[i] === 'string')) {
                                    labelColumn = i;
                                    break;
                                }
                            }
                            
                            // Find a suitable data column (must be numeric)
                            for (let i = 0; i < columns.length; i++) {
                                if (i !== labelColumn && values.every(row => 
                                    typeof row[i] === 'number' || 
                                    (!isNaN(parseFloat(row[i])) && row[i] !== null))) {
                                    dataColumn = i;
                                    break;
                                }
                            }
                            
                            // Extract data
                            const labels = values.map(row => row[labelColumn]);
                            const data = values.map(row => parseFloat(row[dataColumn]));
                            
                            // Create chart
                            new Chart(canvas, {
                                type: chartType,
                                data: {
                                    labels: labels,
                                    datasets: [{
                                        label: columns[dataColumn],
                                        data: data,
                                        backgroundColor: chartType === 'line' ? 'rgba(67, 97, 238, 0.2)' : 
                                            labels.map((_, i) => {
                                                const hue = (i * 30) % 360;
                                                return chartType === 'pie' ? 
                                                    `hsl(${hue}, 70%, 60%)` : 
                                                    `rgba(67, 97, 238, ${0.5 + (i * 0.5 / labels.length)})`;
                                            }),
                                        borderColor: chartType === 'line' ? 'rgba(67, 97, 238, 1)' : 
                                            labels.map((_, i) => {
                                                const hue = (i * 30) % 360;
                                                return chartType === 'pie' ? 
                                                    `hsl(${hue}, 70%, 50%)` : 
                                                    'rgba(67, 97, 238, 1)';
                                            }),
                                        borderWidth: 1
                                    }]
                                },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    scales: {
                                        y: {
                                            beginAtZero: true,
                                            display: chartType !== 'pie'
                                        },
                                        x: {
                                            display: chartType !== 'pie'
                                        }
                                    }
                                }
                            });
                        }
                    }
                }
            }

        // Toast notification function
        function showToast(message, type = 'info') {
            const toastContainer = document.querySelector('.toast-container');
            
            const toast = document.createElement('div');
            toast.className = `toast show`;
            toast.innerHTML = `
                <div class="toast-header bg-${type} text-white">
                    <strong class="me-auto">
                        <i class="fas ${type === 'success' ? 'fa-check-circle' : 
                                      type === 'warning' ? 'fa-exclamation-triangle' : 
                                      type === 'danger' ? 'fa-times-circle' : 'fa-info-circle'} me-2"></i>
                        ${type.charAt(0).toUpperCase() + type.slice(1)}
                    </strong>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
                <div class="toast-body">
                    ${message}
                </div>
            `;
            
            toastContainer.appendChild(toast);
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (toastContainer.contains(toast)) {
                        toastContainer.removeChild(toast);
                    }
                }, 500);
            }, 5000);
            
            // Close button functionality
            const closeBtn = toast.querySelector('.btn-close');
            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    toast.classList.remove('show');
                    setTimeout(() => {
                        if (toastContainer.contains(toast)) {
                            toastContainer.removeChild(toast);
                        }
                    }, 500);
                });
            }
        }
    </script>
</body>
</html>
